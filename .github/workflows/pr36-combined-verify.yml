name: PR36 combined main verify

on:
  push:
    branches:
      - astra/issue-34-39968706926

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Meta ingestion head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge current main in verification workspace
        run: |
          git fetch origin main
          git config user.name "barbara-integration-check"
          git config user.email "barbara-integration-check@users.noreply.github.com"
          git merge --no-edit origin/main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --prefix web
      - name: Full combined check
        run: npm run check
      - name: Combined diff check
        run: git diff --check origin/main HEAD
