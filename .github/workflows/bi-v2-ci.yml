name: BI v2 CI

on:
  push:
    branches:
      - bi-v2
    paths:
      - "web/**"
      - ".github/workflows/bi-v2-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/bi-v2-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
