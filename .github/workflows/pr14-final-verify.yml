name: PR14 final verification

on:
  push:
    branches:
      - astra/issue-12-39783623077

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Full repository check
        run: npm run check
      - name: Diff whitespace check
        run: git diff --check 982a4b71f6dd53ade5fa49b6065b5fb156119cda..HEAD
